<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
  <title>Resume Viewer — Samarth Haveliwala</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- PDF.js Engine (for .pdf) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- JSZip & docx-preview Engine (for .docx) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-chrome: #202124;
      --bg-toolbar: #2b2b2f;
      --bg-sidebar: #1f1f23;
      --border-dark: #3c3c43;
      --accent-green: #24b47e;
      --accent-yellow: #facc15;
      --accent-red: #ef4444;
      --accent-blue: #2563eb;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --sidebar-width: 200px;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-chrome);
      color: var(--text-main);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* =========================================================================
       CHROME-STYLE TOP TOOLBAR
       ========================================================================= */
    header.chrome-toolbar {
      height: 52px;
      background: var(--bg-toolbar);
      border-bottom: 2px solid #000;
      box-shadow: 0 3px 0 #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 1000;
      flex-shrink: 0;
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-btn {
      height: 34px;
      padding: 0 10px;
      background: #18181b;
      color: var(--text-main);
      border: 1.5px solid #000;
      box-shadow: 2px 2px 0 #000;
      border-radius: 4px;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.12s ease;
      white-space: nowrap;
    }

    .toolbar-btn:hover {
      background: #323238;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 #000;
    }

    .toolbar-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 #000;
    }

    .toolbar-btn.btn-active {
      background: var(--accent-yellow);
      color: #000;
      border-color: #000;
    }

    .toolbar-btn.btn-green {
      background: var(--accent-green);
      color: #000;
      font-weight: 800;
    }

    .toolbar-btn.btn-green:hover {
      background: #1ea06e;
    }

    .toolbar-btn.btn-icon-only {
      width: 34px;
      padding: 0;
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border-dark);
      margin: 0 2px;
    }

    /* Page Navigation Control */
    .page-nav-box {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #18181b;
      border: 1.5px solid #000;
      box-shadow: 2px 2px 0 #000;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .page-input {
      width: 32px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12px;
      outline: none;
    }

    .page-total {
      color: var(--text-muted);
      font-size: 11px;
    }

    /* Doc Title Meta */
    .doc-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 280px;
      overflow: hidden;
    }

    .doc-title-text {
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .format-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    /* =========================================================================
       WORKSPACE: SIDEBAR + MAIN CANVAS
       ========================================================================= */
    .viewer-workspace {
      flex: 1;
      width: 100%;
      height: calc(100% - 52px);
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Chrome-Style Thumbnail Sidebar */
    aside.thumbnail-sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 2px solid #000;
      box-shadow: 3px 0 0 rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      z-index: 50;
      transition: width 0.2s ease, transform 0.2s ease;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 10px;
      gap: 14px;
    }

    aside.thumbnail-sidebar.collapsed {
      width: 0;
      padding: 0;
      border-right: none;
      overflow: hidden;
      visibility: hidden;
    }

    .thumb-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .thumb-item:hover {
      opacity: 1;
      transform: scale(1.02);
    }

    .thumb-item.active-thumb {
      opacity: 1;
    }

    .thumb-preview-wrap {
      width: 100%;
      background: #fff;
      border: 2px solid #000;
      box-shadow: 2px 2px 0 #000;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .thumb-item.active-thumb .thumb-preview-wrap {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 2px var(--accent-green), 3px 3px 0 #000;
    }

    .thumb-canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .thumb-label {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      font-weight: 700;
    }

    .thumb-item.active-thumb .thumb-label {
      color: var(--accent-green);
    }

    /* Main Scrollable Document Viewer */
    main.document-viewport {
      flex: 1;
      height: 100%;
      background: var(--bg-chrome);
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 80px 16px;
      position: relative;
    }

    /* Document Pages Stream */
    #pages-stream {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 900px;
      transition: max-width 0.15s ease;
    }

    .pdf-page-card {
      background: #fff;
      border: 2px solid #000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 4px 4px 0 #000;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      max-width: 100%;
    }

    .pdf-canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .page-floating-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 3px 7px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
    }

    /* =========================================================================
       DOCX STYLING FOR WORD DOCUMENTS
       ========================================================================= */
    .docx-wrapper {
      background: transparent !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      gap: 20px !important;
      width: 100% !important;
      user-select: text;
    }

    .docx-wrapper > section.docx {
      background: #ffffff !important;
      color: #111827 !important;
      border: 2px solid #000000 !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 4px 4px 0 #000 !important;
      border-radius: 2px !important;
      margin-bottom: 20px !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
      line-height: 1.6 !important;
    }

    /* DOC Legacy Binary Viewer Iframe */
    #doc-legacy-frame {
      width: 100%;
      height: calc(100vh - 120px);
      border: 2px solid #000;
      box-shadow: 4px 4px 0 #000;
      background: #fff;
      display: none;
    }

    /* Loading Screen */
    #loading-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-main);
    }

    .loading-spinner {
      font-size: 44px;
      color: var(--accent-green);
    }

    /* Error Card */
    #error-card {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 36px 24px;
      max-width: 480px;
      background: #18181b;
      border: 2.5px solid #000;
      box-shadow: 6px 6px 0 #000;
      margin: 40px auto;
    }

    /* Floating Quick Actions Bar for Mobile */
    .mobile-bottom-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(26, 26, 30, 0.96);
      backdrop-filter: blur(10px);
      border-top: 2px solid #000;
      padding: 10px 14px;
      box-shadow: 0 -4px 0 #000;
      z-index: 1000;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-mobile-dl {
      flex: 1;
      height: 42px;
      background: var(--accent-green);
      color: #000;
      border: 2px solid #000;
      box-shadow: 3px 3px 0 #000;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-mobile-dl:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }

    /* Responsive adjustments */
    @media (max-width: 820px) {
      .doc-meta { display: none; }
      .hide-mobile { display: none !important; }
      .mobile-bottom-bar { display: flex; }
      main.document-viewport {
        padding: 14px 6px 90px 6px;
      }
      aside.thumbnail-sidebar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        background: rgba(26, 26, 30, 0.98);
        box-shadow: 6px 0 0 #000;
        z-index: 500;
      }
      aside.thumbnail-sidebar.collapsed {
        transform: translateX(-100%);
      }
      .docx-wrapper > section.docx {
        padding: 20px 16px !important;
        width: 100% !important;
        box-shadow: 0 4px 14px rgba(0,0,0,0.4) !important;
      }
    }
  </style>
</head>
<body>

  <!-- Chrome-Style Top Toolbar -->
  <header class="chrome-toolbar">
    <!-- Left Section: Sidebar Toggle + Document Title -->
    <div class="toolbar-section">
      <button type="button" class="toolbar-btn btn-icon-only" id="btn-toggle-sidebar" title="Toggle Document Navigation (T)">
        <i class="fas fa-bars"></i>
      </button>

      <a href="/resume" class="toolbar-btn" title="Back to Interactive Web Resume">
        <i class="fas fa-arrow-left"></i> <span>Resume</span>
      </a>

      <div class="doc-meta hide-mobile">
        <i class="fas fa-file-pdf" id="doc-type-icon" style="color: #ef4444; font-size: 16px;"></i>
        <span class="doc-title-text" id="doc-title-text">Samarth_resume.pdf</span>
        <span class="format-badge" id="doc-format-badge">PDF</span>
      </div>
    </div>

    <!-- Center Section: Page Navigator + Zoom Controls -->
    <div class="toolbar-section">
      <!-- Page Navigation -->
      <div class="page-nav-box" id="page-nav-container">
        <button type="button" id="btn-page-prev" style="background: none; border: none; color: inherit; cursor: pointer; padding: 2px 5px;" title="Previous Page (PageUp)">
          <i class="fas fa-chevron-left" style="font-size: 10px;"></i>
        </button>
        <input type="text" id="page-num-input" class="page-input" value="1" title="Jump to page" />
        <span class="page-total">/ <span id="page-count-text">1</span></span>
        <button type="button" id="btn-page-next" style="background: none; border: none; color: inherit; cursor: pointer; padding: 2px 5px;" title="Next Page (PageDown)">
          <i class="fas fa-chevron-right" style="font-size: 10px;"></i>
        </button>
      </div>

      <div class="toolbar-divider hide-mobile"></div>

      <!-- Zoom Controls -->
      <button type="button" class="toolbar-btn btn-icon-only hide-mobile" id="btn-zoom-out" title="Zoom Out (-)">
        <i class="fas fa-minus"></i>
      </button>
      <button type="button" class="toolbar-btn hide-mobile" id="btn-zoom-preset" title="Fit to Width / Reset Zoom (0)">
        <span id="zoom-level-text">Fit Width</span>
      </button>
      <button type="button" class="toolbar-btn btn-icon-only hide-mobile" id="btn-zoom-in" title="Zoom In (+)">
        <i class="fas fa-plus"></i>
      </button>

      <!-- Rotate clockwise -->
      <button type="button" class="toolbar-btn btn-icon-only hide-mobile" id="btn-rotate" title="Rotate Clockwise (R)">
        <i class="fas fa-rotate-right"></i>
      </button>
    </div>

    <!-- Right Section: Print, Download, Fullscreen -->
    <div class="toolbar-section">
      <button type="button" class="toolbar-btn btn-icon-only hide-mobile" id="btn-print" title="Print Document (Ctrl+P)">
        <i class="fas fa-print"></i>
      </button>

      <button type="button" class="toolbar-btn btn-icon-only hide-mobile" id="btn-fullscreen" title="Toggle Fullscreen (F)">
        <i class="fas fa-expand"></i>
      </button>

      <button type="button" class="toolbar-btn btn-green" id="btn-download" title="Download Document (Ctrl+S)">
        <i class="fas fa-download"></i> <span id="btn-dl-text">Download</span>
      </button>
    </div>
  </header>

  <!-- Workspace: Thumbnail Sidebar + Document Viewport -->
  <div class="viewer-workspace">
    <!-- Chrome Thumbnail Sidebar -->
    <aside class="thumbnail-sidebar" id="thumbnail-sidebar" title="Document Navigation">
      <!-- Injected dynamically -->
    </aside>

    <!-- Document Viewport -->
    <main class="document-viewport" id="document-viewport">
      <!-- Loading State -->
      <div id="loading-overlay">
        <i class="fas fa-circle-notch fa-spin loading-spinner"></i>
        <h3 style="font-family: var(--font-display); font-size: 18px; margin-top: 10px;">Rendering Document...</h3>
        <p style="font-size: 12px; color: var(--text-muted); font-family: var(--font-mono);">
          Supporting PDF, DOCX &amp; DOC on Mobile &amp; Desktop
        </p>
      </div>

      <!-- Error State -->
      <div id="error-card">
        <i class="fas fa-triangle-exclamation" style="font-size: 38px; color: #ef4444;"></i>
        <h3 style="font-family: var(--font-display); font-size: 18px;">Unable to Preview Document</h3>
        <p style="font-size: 12px; color: var(--text-muted); font-family: var(--font-mono);" id="error-desc">
          No document file found.
        </p>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button type="button" class="toolbar-btn btn-green" id="btn-fallback-dl">
            <i class="fas fa-download"></i> Download Directly
          </button>
          <a href="/resume" class="toolbar-btn">
            <i class="fas fa-arrow-left"></i> Back to Resume
          </a>
        </div>
      </div>

      <!-- Rendered Document Container (PDF canvases or DOCX HTML) -->
      <div id="pages-stream"></div>

      <!-- Legacy DOC Viewer IFrame -->
      <iframe id="doc-legacy-frame" title="Word Document Preview"></iframe>
    </main>
  </div>

  <!-- Mobile Floating Bottom Bar -->
  <aside class="mobile-bottom-bar">
    <button type="button" class="toolbar-btn" id="btn-mobile-sidebar-toggle" style="height: 42px; padding: 0 12px;">
      <i class="fas fa-bars"></i> <span>Pages</span>
    </button>
    <button type="button" class="btn-mobile-dl" id="btn-mobile-dl">
      <i class="fas fa-cloud-arrow-down fa-lg"></i>
      <span id="mobile-dl-btn-text">Download Document</span>
    </button>
    <button type="button" class="toolbar-btn btn-icon-only" id="btn-mobile-share" style="height: 42px; width: 42px;" title="Share Resume">
      <i class="fas fa-share-nodes"></i>
    </button>
  </aside>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = "https://npzqpcagdtnfuqhyngro.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wenFwY2FnZHRuZnVxaHluZ3JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMjEzOTEsImV4cCI6MjEwODY5NzM5MX0.N20yyXXnX-ddUDo43ynQOe6f0r6ZoeK4w1MUpPzs37Y";

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }

    let pdfDoc = null;
    let docBlob = null;
    let docFilename = "Samarth_resume.pdf";
    let docPublicUrl = "";
    let docFormat = "pdf"; // "pdf" | "docx" | "doc"
    let rotation = 0;
    let zoomFactor = 1.0;
    let currentPage = 1;
    let isSidebarOpen = window.innerWidth > 900;

    // Detect format from filename or url
    function detectFileFormat(name, url) {
      const combined = `${name || ''} ${url || ''}`.toLowerCase();
      if (combined.includes(".docx")) return "docx";
      if (combined.includes(".doc")) return "doc";
      return "pdf";
    }

    // Fetch Resume Data from Supabase DB or Local JSON fallback
    async function getResumeDownloadData() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/portfolio_data?id=eq.main&select=*`, {
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        if (res.ok) {
          const rows = await res.json();
          if (rows?.[0]?.data?.resume?.download) {
            return rows[0].data.resume.download;
          }
        }
      } catch (e) {
        console.warn("Supabase fetch fallback:", e);
      }

      try {
        const res = await fetch("/data/portfolio-data.json");
        if (res.ok) {
          const json = await res.json();
          if (json?.resume?.download) return json.resume.download;
        }
      } catch (e) {
        console.error("Local data fallback error:", e);
      }
      return null;
    }

    // Main Initializer
    async function initDocumentViewer() {
      const loadingEl = document.getElementById("loading-overlay");
      const errorCard = document.getElementById("error-card");
      const errorDesc = document.getElementById("error-desc");
      const titleEl = document.getElementById("doc-title-text");
      const typeIcon = document.getElementById("doc-type-icon");
      const formatBadge = document.getElementById("doc-format-badge");
      const pageCountEl = document.getElementById("page-count-text");
      const mobileDlText = document.getElementById("mobile-dl-btn-text");
      const dlBtnText = document.getElementById("btn-dl-text");
      const sidebarEl = document.getElementById("thumbnail-sidebar");

      if (!isSidebarOpen) sidebarEl.classList.add("collapsed");

      try {
        const config = await getResumeDownloadData();
        if (!config?.fileUrl) {
          throw new Error("No resume file has been attached yet in the Admin Panel.");
        }

        docFilename = config.fileName || "Samarth_resume.pdf";
        docPublicUrl = config.fileUrl;
        docFormat = detectFileFormat(docFilename, docPublicUrl);

        titleEl.textContent = docFilename;
        document.title = `${docFilename} — Document Preview`;

        // Update UI Badges & Icons
        if (docFormat === "docx") {
          typeIcon.className = "fas fa-file-word";
          typeIcon.style.color = "#2563eb";
          formatBadge.textContent = "DOCX Word";
          formatBadge.style.color = "#60a5fa";
          formatBadge.style.borderColor = "#2563eb";
          dlBtnText.textContent = "Download DOCX";
          mobileDlText.textContent = config.fileSize ? `Download DOCX (${config.fileSize})` : "Download DOCX";
        } else if (docFormat === "doc") {
          typeIcon.className = "fas fa-file-word";
          typeIcon.style.color = "#2563eb";
          formatBadge.textContent = "DOC Legacy";
          formatBadge.style.color = "#60a5fa";
          formatBadge.style.borderColor = "#2563eb";
          dlBtnText.textContent = "Download DOC";
          mobileDlText.textContent = config.fileSize ? `Download DOC (${config.fileSize})` : "Download DOC";
        } else {
          typeIcon.className = "fas fa-file-pdf";
          typeIcon.style.color = "#ef4444";
          formatBadge.textContent = "PDF";
          formatBadge.style.color = "#f87171";
          formatBadge.style.borderColor = "#ef4444";
          dlBtnText.textContent = "Download PDF";
          mobileDlText.textContent = config.fileSize ? `Download PDF (${config.fileSize})` : "Download PDF";
        }

        // Fetch binary ArrayBuffer from Supabase Storage CDN
        const res = await fetch(docPublicUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status} failed to fetch document from storage.`);

        const arrayBuffer = await res.arrayBuffer();
        const mimeType = docFormat === "docx"
          ? "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          : (docFormat === "doc" ? "application/msword" : "application/pdf");
        docBlob = new Blob([arrayBuffer], { type: mimeType });

        // ROUTE RENDERER BASED ON FORMAT
        if (docFormat === "docx") {
          await renderDocxDocument(arrayBuffer);
        } else if (docFormat === "doc") {
          await renderLegacyDocDocument(docPublicUrl);
        } else {
          await renderPdfDocument(arrayBuffer);
        }

        loadingEl.style.display = "none";

      } catch (err) {
        console.error("Document load error:", err);
        loadingEl.style.display = "none";
        errorCard.style.display = "flex";
        errorDesc.textContent = err.message;
      }
    }

    // =========================================================================
    // 1. DOCX RENDERER (Using docx-preview)
    // =========================================================================
    async function renderDocxDocument(arrayBuffer) {
      const stream = document.getElementById("pages-stream");
      const pageNav = document.getElementById("page-nav-container");
      const sidebar = document.getElementById("thumbnail-sidebar");
      const rotateBtn = document.getElementById("btn-rotate");
      stream.innerHTML = "";

      if (rotateBtn) rotateBtn.style.display = "none";

      const docxContainer = document.createElement("div");
      docxContainer.id = "docx-render-target";
      docxContainer.style.width = "100%";
      stream.appendChild(docxContainer);

      if (!window.docx || !docx.renderAsync) {
        throw new Error("Word DOCX rendering engine not loaded.");
      }

      await docx.renderAsync(arrayBuffer, docxContainer, null, {
        className: "docx",
        inWrapper: true,
        ignoreWidth: false,
        ignoreHeight: false,
        breakPages: true,
        useBase64URL: true,
        renderChanges: false
      });

      // Count pages generated by docx-preview
      const pages = docxContainer.querySelectorAll("section.docx");
      const pageCount = Math.max(pages.length, 1);
      document.getElementById("page-count-text").textContent = pageCount;

      // Render thumbnail sidebar for DOCX
      sidebar.innerHTML = "";
      pages.forEach((p, idx) => {
        const item = document.createElement("div");
        item.className = `thumb-item ${idx === 0 ? 'active-thumb' : ''}`;
        item.onclick = () => {
          p.scrollIntoView({ behavior: "smooth", block: "start" });
          currentPage = idx + 1;
          updatePageIndicator();
        };

        const wrap = document.createElement("div");
        wrap.className = "thumb-preview-wrap";
        wrap.style.height = "70px";
        wrap.style.background = "#fff";
        wrap.style.display = "flex";
        wrap.style.alignItems = "center";
        wrap.style.justifyContent = "center";
        wrap.style.fontSize = "22px";
        wrap.style.color = "#2563eb";
        wrap.innerHTML = `<i class="fas fa-file-word"></i>`;

        const label = document.createElement("span");
        label.className = "thumb-label";
        label.textContent = `Page ${idx + 1}`;

        item.appendChild(wrap);
        item.appendChild(label);
        sidebar.appendChild(item);
      });

      setupDocxScrollObserver();
    }

    function setupDocxScrollObserver() {
      const viewport = document.getElementById("document-viewport");
      viewport.addEventListener("scroll", () => {
        const pages = document.querySelectorAll(".docx-wrapper > section.docx");
        let visibleIdx = 1;
        pages.forEach((p, idx) => {
          const rect = p.getBoundingClientRect();
          if (rect.top <= window.innerHeight / 2 && rect.bottom >= window.innerHeight / 4) {
            visibleIdx = idx + 1;
          }
        });
        if (visibleIdx !== currentPage) {
          currentPage = visibleIdx;
          updatePageIndicator();
        }
      }, { passive: true });
    }

    // =========================================================================
    // 2. LEGACY DOC RENDERER (Office Online / Google Docs Viewer Embed)
    // =========================================================================
    async function renderLegacyDocDocument(publicUrl) {
      const stream = document.getElementById("pages-stream");
      const frame = document.getElementById("doc-legacy-frame");
      const pageNav = document.getElementById("page-nav-container");
      const sidebarToggle = document.getElementById("btn-toggle-sidebar");
      const rotateBtn = document.getElementById("btn-rotate");

      if (stream) stream.style.display = "none";
      if (pageNav) pageNav.style.display = "none";
      if (sidebarToggle) sidebarToggle.style.display = "none";
      if (rotateBtn) rotateBtn.style.display = "none";

      if (frame) {
        frame.style.display = "block";
        // Google Docs Viewer handles binary .doc securely
        frame.src = `https://docs.google.com/viewer?url=${encodeURIComponent(publicUrl)}&embedded=true`;
      }
    }

    // =========================================================================
    // 3. PDF RENDERER (Using PDF.js Canvas Engine)
    // =========================================================================
    async function renderPdfDocument(arrayBuffer) {
      const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) });
      pdfDoc = await loadingTask.promise;

      document.getElementById("page-count-text").textContent = pdfDoc.numPages;

      await renderAllPdfPages();
      await renderPdfThumbnails();
      setupPdfScrollObserver();
    }

    async function renderAllPdfPages() {
      const stream = document.getElementById("pages-stream");
      stream.innerHTML = "";

      const viewportWidth = document.getElementById("document-viewport").clientWidth - 32;
      const baseMaxWidth = Math.min(Math.max(viewportWidth * 0.92, 320), 880);
      const targetWidth = baseMaxWidth * zoomFactor;

      stream.style.maxWidth = `${targetWidth}px`;

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const page = await pdfDoc.getPage(i);
        const originalViewport = page.getViewport({ scale: 1.0, rotation });

        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const scale = (targetWidth / originalViewport.width) * dpr;
        const viewport = page.getViewport({ scale, rotation });

        const card = document.createElement("div");
        card.className = "pdf-page-card";
        card.id = `pdf-page-${i}`;
        card.style.width = `${targetWidth}px`;

        const canvas = document.createElement("canvas");
        canvas.className = "pdf-canvas";
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        const ctx = canvas.getContext("2d", { alpha: false });
        await page.render({ canvasContext: ctx, viewport }).promise;

        const badge = document.createElement("span");
        badge.className = "page-floating-badge";
        badge.textContent = `${i} / ${pdfDoc.numPages}`;

        card.appendChild(canvas);
        card.appendChild(badge);
        stream.appendChild(card);
      }
    }

    async function renderPdfThumbnails() {
      const sidebar = document.getElementById("thumbnail-sidebar");
      sidebar.innerHTML = "";

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const page = await pdfDoc.getPage(i);
        const vp = page.getViewport({ scale: 0.25, rotation });

        const item = document.createElement("div");
        item.className = `thumb-item ${i === 1 ? 'active-thumb' : ''}`;
        item.id = `thumb-${i}`;
        item.onclick = () => scrollToPage(i);

        const wrap = document.createElement("div");
        wrap.className = "thumb-preview-wrap";

        const canvas = document.createElement("canvas");
        canvas.className = "thumb-canvas";
        canvas.width = vp.width;
        canvas.height = vp.height;

        const ctx = canvas.getContext("2d");
        await page.render({ canvasContext: ctx, viewport: vp }).promise;

        const label = document.createElement("span");
        label.className = "thumb-label";
        label.textContent = `Page ${i}`;

        wrap.appendChild(canvas);
        item.appendChild(wrap);
        item.appendChild(label);
        sidebar.appendChild(item);
      }
    }

    function scrollToPage(num) {
      if (docFormat === "docx") {
        const pages = document.querySelectorAll(".docx-wrapper > section.docx");
        if (pages[num - 1]) {
          pages[num - 1].scrollIntoView({ behavior: "smooth", block: "start" });
          currentPage = num;
          updatePageIndicator();
        }
        return;
      }

      const target = document.getElementById(`pdf-page-${num}`);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        currentPage = num;
        updatePageIndicator();
      }
    }

    function setupPdfScrollObserver() {
      const viewport = document.getElementById("document-viewport");
      viewport.addEventListener("scroll", () => {
        const stream = document.getElementById("pages-stream");
        const cards = stream.querySelectorAll(".pdf-page-card");
        let visibleIndex = 1;

        cards.forEach((card, idx) => {
          const rect = card.getBoundingClientRect();
          if (rect.top <= window.innerHeight / 2 && rect.bottom >= window.innerHeight / 4) {
            visibleIndex = idx + 1;
          }
        });

        if (visibleIndex !== currentPage) {
          currentPage = visibleIndex;
          updatePageIndicator();
        }
      }, { passive: true });
    }

    function updatePageIndicator() {
      const input = document.getElementById("page-num-input");
      if (input) input.value = currentPage;

      document.querySelectorAll(".thumb-item").forEach((thumb, idx) => {
        thumb.classList.toggle("active-thumb", idx + 1 === currentPage);
      });
    }

    // Direct Download
    function triggerDownload() {
      if (docBlob) {
        const blobUrl = URL.createObjectURL(docBlob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = docFilename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
      } else if (docPublicUrl) {
        window.open(docPublicUrl, "_blank");
      }
    }

    // Web Share API
    async function triggerShare() {
      if (navigator.share) {
        try {
          await navigator.share({
            title: `Samarth Haveliwala — ${docFilename}`,
            text: "Take a look at Samarth's developer resume & experience.",
            url: window.location.href
          });
        } catch (e) {}
      } else {
        triggerDownload();
      }
    }

    // Bind Controls
    document.getElementById("btn-download").onclick = triggerDownload;
    document.getElementById("btn-mobile-dl").onclick = triggerDownload;
    document.getElementById("btn-fallback-dl").onclick = triggerDownload;
    document.getElementById("btn-mobile-share").onclick = triggerShare;

    document.getElementById("btn-print").onclick = () => window.print();

    // Toggle Sidebar
    function toggleSidebar() {
      const sb = document.getElementById("thumbnail-sidebar");
      isSidebarOpen = !isSidebarOpen;
      sb.classList.toggle("collapsed", !isSidebarOpen);
      document.getElementById("btn-toggle-sidebar").classList.toggle("btn-active", isSidebarOpen);
    }

    document.getElementById("btn-toggle-sidebar").onclick = toggleSidebar;
    document.getElementById("btn-mobile-sidebar-toggle").onclick = toggleSidebar;

    // Page Prev / Next
    document.getElementById("btn-page-prev").onclick = () => {
      if (currentPage > 1) scrollToPage(currentPage - 1);
    };
    document.getElementById("btn-page-next").onclick = () => {
      const maxPages = docFormat === "docx"
        ? document.querySelectorAll(".docx-wrapper > section.docx").length
        : (pdfDoc ? pdfDoc.numPages : 1);
      if (currentPage < maxPages) scrollToPage(currentPage + 1);
    };

    const pageInput = document.getElementById("page-num-input");
    pageInput.onchange = (e) => {
      const val = parseInt(e.target.value, 10);
      const maxPages = docFormat === "docx"
        ? document.querySelectorAll(".docx-wrapper > section.docx").length
        : (pdfDoc ? pdfDoc.numPages : 1);
      if (val >= 1 && val <= maxPages) {
        scrollToPage(val);
      } else {
        e.target.value = currentPage;
      }
    };

    // Zoom Controls
    document.getElementById("btn-zoom-in").onclick = async () => {
      zoomFactor = Math.min(zoomFactor + 0.15, 2.0);
      document.getElementById("zoom-level-text").textContent = `${Math.round(zoomFactor * 100)}%`;
      if (docFormat === "pdf" && pdfDoc) {
        await renderAllPdfPages();
      } else if (docFormat === "docx") {
        document.getElementById("pages-stream").style.maxWidth = `${Math.round(900 * zoomFactor)}px`;
      }
    };

    document.getElementById("btn-zoom-out").onclick = async () => {
      zoomFactor = Math.max(zoomFactor - 0.15, 0.5);
      document.getElementById("zoom-level-text").textContent = `${Math.round(zoomFactor * 100)}%`;
      if (docFormat === "pdf" && pdfDoc) {
        await renderAllPdfPages();
      } else if (docFormat === "docx") {
        document.getElementById("pages-stream").style.maxWidth = `${Math.round(900 * zoomFactor)}px`;
      }
    };

    document.getElementById("btn-zoom-preset").onclick = async () => {
      zoomFactor = 1.0;
      document.getElementById("zoom-level-text").textContent = "Fit Width";
      if (docFormat === "pdf" && pdfDoc) {
        await renderAllPdfPages();
      } else if (docFormat === "docx") {
        document.getElementById("pages-stream").style.maxWidth = "900px";
      }
    };

    // Rotate (PDF only)
    document.getElementById("btn-rotate").onclick = async () => {
      if (docFormat === "pdf" && pdfDoc) {
        rotation = (rotation + 90) % 360;
        await renderAllPdfPages();
        await renderPdfThumbnails();
      }
    };

    // Fullscreen Toggle
    document.getElementById("btn-fullscreen").onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    // Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "p") {
        e.preventDefault();
        window.print();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        triggerDownload();
      } else if (e.key === "+" || e.key === "=") {
        document.getElementById("btn-zoom-in").click();
      } else if (e.key === "-") {
        document.getElementById("btn-zoom-out").click();
      } else if (e.key === "0") {
        document.getElementById("btn-zoom-preset").click();
      } else if (e.key.toLowerCase() === "r") {
        document.getElementById("btn-rotate").click();
      } else if (e.key.toLowerCase() === "t") {
        toggleSidebar();
      } else if (e.key.toLowerCase() === "f") {
        document.getElementById("btn-fullscreen").click();
      }
    });

    // Touch Pinch-to-Zoom for Mobile
    let initialPinchDistance = null;
    let initialZoomFactor = 1.0;
    const viewportEl = document.getElementById("document-viewport");

    viewportEl.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        initialZoomFactor = zoomFactor;
      }
    }, { passive: true });

    viewportEl.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        const ratio = currentDistance / initialPinchDistance;
        const newZoom = Math.min(Math.max(initialZoomFactor * ratio, 0.6), 2.2);
        const stream = document.getElementById("pages-stream");
        if (stream) {
          stream.style.maxWidth = `${Math.round(window.innerWidth * newZoom)}px`;
        }
      }
    }, { passive: true });

    viewportEl.addEventListener("touchend", () => {
      initialPinchDistance = null;
    }, { passive: true });

    // Handle Window Resize
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (docFormat === "pdf" && pdfDoc) renderAllPdfPages();
      }, 250);
    });

    // Run
    initDocumentViewer();
  </script>
</body>
</html>
